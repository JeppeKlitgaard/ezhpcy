name: Pre-Commit Checks
on: [pull_request]

# Note: we use prek (https://github.com/j178/prek) instead of pre-commit
# prek is fully compatible, faster, and generally a better experience than pre-commit.

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ruff and pyrefly hooks run `uv run`, which needs uv and Python
      - name: Setup uv and python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"  # uv version, should match lower bound uv_build in pyproject.toml#build-system
          python-version: "3.15"
          enable-cache: "auto"

      - name: Pre-Commit
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          # Should match version in pyproject.toml
          prek-version: 0.5.6
