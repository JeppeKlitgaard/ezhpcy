repos:
  # Miscellaneous pre-commits
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Security
      - id: detect-private-key

      # Nit
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # Windows
      - id: check-illegal-windows-names
      - id: check-case-conflict

      # Data formats
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # Python
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared test helpers, not test modules
        exclude: ^tests/support/

  # Ruff and Pyrefly run through uv so their versions come from the dependency
  # groups in pyproject.toml (pinned by uv.lock)
  - repo: local
    hooks:
      # Ruff: run the linter and fix what is possible
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run --group format ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # Ruff: run the formatter and fix code styling
      - id: ruff-format
        name: Ruff (format)
        entry: uv run --group format ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # Pyrefly: static type checking, with imports resolved against the project venv
      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: uv run --group typecheck pyrefly check
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false  # Full repo check, matching `just check`
