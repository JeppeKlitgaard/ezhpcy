repos:
  # Miscellaneous pre-commits
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Security
      - id: detect-private-key

      # Nit
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # Windows
      - id: check-illegal-windows-names
      - id: check-case-conflict

      # Data formats
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # Python
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared test helpers, not test modules
        exclude: ^tests/support/

  # Ruff: linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with pyproject.toml
    rev: v0.16.10
    hooks:
      # Run the linter and fix what is possible
      - id: ruff-check
        args: ["--fix"]

      # Run the formatter and fix code styling
      - id: ruff-format

  # Pyrefly: static type checking
  # - repo: https://github.com/facebook/pyrefly-pre-commit
  #   rev: 1.4.0  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  #   hooks:
  #     - id: pyrefly-check
  #       name: Pyrefly (type checking)
  #       pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
  #       language: system  # Use pyrefly from environment
