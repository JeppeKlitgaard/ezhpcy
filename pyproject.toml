[project]
name = "dtuhpc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=4.0.0",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
dtuhpc = "dtuhpc.cli.entry:main"

[dependency-groups]
dev = ["ipykernel>=7.2.0", "pip>=26.0.1", "ruff>=0.15.21"]


[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
