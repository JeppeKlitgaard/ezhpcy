[project]
name = "ezhpcy"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    # Pydantic
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.5",
    # Templates
    "jinja2>=3.1.6",
    # SSH
    "asyncssh>=2.24.1",
    # CLI
    "rich>=15.0.0",
    "cyclopts>=5.2.0",
    # Keyring, secretstorage is for keyring on Linux
    "keyring>=25.7.0",
    "secretstorage>=3.5.0 ; sys_platform == 'linux'",
    # Utils
    "py-machineid>=1.0.0",
    "platformdirs>=4.9.4",
]

[project.scripts]
ezhpcy = "ezhpcy.cli:main"

[dependency-groups]
dev = [
    { include-group = "format" },
    { include-group = "pre-commit" },
    { include-group = "test" },
    { include-group = "typecheck" },
]

format = [
    "ruff>=0.16.10", # keep in sync with .pre-commit-config.yaml
]
pre-commit = [
    "prek>=0.4.9",
    { include-group = "typecheck" }, # For pyrefly that uses pyrefly from deps
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
typecheck = [
    "pyrefly>=1.4.0",
]

# Tests
[tool.pytest.ini_options]
# `async def` tests and fixtures run on asyncio without a marker
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test coverage
[tool.coverage.run]
source = ["ezhpcy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Ruff - Linting
[tool.ruff.lint]
preview = true
extend-select = [
    "A",     # flake8-builtins
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "DTZ",   # flake8-datetimetz
    "EXE",   # flake8-executable
    "FURB",  # refurb
    "I",     # isort
    "INP",   # flake8-no-pep420
    "LOG",   # flake8-logging
    "PTH",   # flake8-use-pathlib
    "T10",   # flake8-debugger
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
]
ignore = [
    "RUF106", # rule-codecs-in-suppression-comments
]
isort.combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests
"tests/**" = [
    "RUF069", # float-equality-comparison, in tests we sometimes want eq. check
]

# Standalone scripts
"scripts/**" = [
    "INP", # no-pep420, scripts are standalone and not part of a package
]

# Pyrefly - Type checking
[tool.pyrefly]
project-includes = [
    "src/**/*.py*",
    "src/**/*.ipynb",
]

# Build system
[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
