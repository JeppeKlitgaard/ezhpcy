[ezhpcy]
schema = 1

[ezhpcy.app.insegt3d."v0.3.1+1"]
name = "InSegt3D"
short_description = "Interactive 3D segmentation"
long_description = """
[InSegt3D](https://github.com/qim-center/insegt3d) is a tool for interactive
segmentation of 3D images.

It requires a GPU to run.

Its documentation can be found at
[https://qim-center.github.io/insegt3d/](https://qim-center.github.io/insegt3d/).
"""
environment = { pixi = "pixi.toml", environment = "default", }
requires = { gpu = true, }
run = {
    command = [
        "insegt3d",
        "--host", "localhost",
        "--port", "{{ port }}",
    ],
    env = { INSEGT3D_TOKEN = "{{ token }}", },
}
endpoint = { transport = "tcp", authenticates = true, }
ready = { check = "http", path = "/?token={{ token }}", timeout = 300, }
access = { url = "http://127.0.0.1:{{ local_port }}/?token={{ token }}", }
