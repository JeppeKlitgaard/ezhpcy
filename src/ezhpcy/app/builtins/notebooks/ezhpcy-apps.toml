# JupyterLab and TensorBoard, sharing one environment.
#
#   ezhpcy tunnel PROFILE --app lab --app tensorboard

[ezhpcy]
schema = 1

[ezhpcy.app.lab."v1.0"]
name = "JupyterLab"
short_description = "JupyterLab with the project's environment"
environment = {
    pixi = "pixi.toml",  # pixi.lock is read from beside it
    environment = "default",
}
run = {
    command = [
        "jupyter", "lab", "--no-browser",
        "--ServerApp.sock={{ socket }}",
        "--KernelManager.transport=ipc",
    ],
    env = { JUPYTER_TOKEN = "{{ token }}", JUPYTER_RUNTIME_DIR = "{{ run_dir }}/jupyter", },
}
endpoint = { transport = "socket", authenticates = true, }
ready = { check = "http", path = "/api", timeout = 180, }
access = { url = "http://127.0.0.1:{{ local_port }}/lab?token={{ token }}", }

[ezhpcy.app.tensorboard."v2.18"]
name = "TensorBoard"
short_description = "TensorBoard over the runs in the workdir"
environment = { pixi = "pixi.toml", }  # the same environment as `lab`: installed once
run = {
    command = [
        "tensorboard",
        "--logdir", "{{ workdir }}/runs",
        "--host", "127.0.0.1",
        "--port", "{{ port }}",
    ],
}
endpoint = { transport = "tcp", }
ready = { check = "http", path = "/", }
