# An SMB server over the node's files, served on a Unix socket.
#
#   ezhpcy tunnel PROFILE --app smb
#
# Mount the printed smb:// URL with your file manager (Finder, GNOME Files,
# `mount_smbfs`, gio). The share is reachable only through EzHPCy's forward;
# log in with user `ezhpcy` and the token from the URL as the password.
#
# On Windows, run the status hint to map the share to Z:. Windows 11 24H2 and
# later can map a port other than 445 (`/TCPPORT`); remove the mapping with
# `NET USE Z: /DELETE`.

[ezhpcy]
schema = 1

[ezhpcy.app.smb."v0.1.0"]
description = "An SMB server over the node's files (impacket)"
environment.pixi = "pixi.toml"
assets.include = ["main.py"]
run.command = ["python", "{assets}/main.py"]
# The login's password is the per-run token; clients authenticate so the server
# can sign its responses (Windows 11 24H2+ reject unsigned guest shares).
run.env = { SMB_PASSWORD = "{token}" }
endpoint.transport = "socket"
endpoint.authenticates = true
ready = { check = "tcp" }
access.url = "smb://ezhpcy:{token}@127.0.0.1:{local_port}/files"
# A literal string: the backslashes are the UNC path's.
access.status_hints = [
    'NET USE Z: \\127.0.0.1\files {token} /USER:ezhpcy /TCPPORT:{local_port}',
]

[ezhpcy.app.smb."v0.1.0".resources]
cores = 1
time_limit = "4:00"
